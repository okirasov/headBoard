# Deboard API on Fly.io — single machine, SQLite + uploaded files on the "data" volume.
app = "deboard-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # appsettings.json pins Urls to localhost:5080 for local runs; the container must listen on all interfaces.
  Urls = "http://0.0.0.0:8080"
  ConnectionStrings__Sqlite = "Data Source=/data/headboard.db"
  Storage__Root = "/data/storage"
  Cors__Origins__0 = "https://de-board.vercel.app"
  Calendar__RedirectUri = "https://deboard-api.fly.dev/calendar/oauth/callback"
  Calendar__AllowedReturnUrls__0 = "https://de-board.vercel.app"
  Calendar__AllowedReturnUrls__1 = "http://localhost:5173"
  Calendar__AllowedReturnUrls__2 = "headboard://"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

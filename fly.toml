# HeadBoard on Fly.io — one machine serves the API and the web app (wwwroot); SQLite + files on the "data" volume.
# Deploy from the repository root: fly deploy --remote-only
app = "headboard-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Public client ids baked into the web bundle (secrets never go here).
    VITE_API_URL = "/"
    VITE_GOOGLE_CLIENT_ID = "990213590248-ajsetps7tbapqqgb6u8h5bud07fjlblo.apps.googleusercontent.com"
    VITE_APPLE_SERVICES_ID = "com.headboard.web"
    VITE_APPLE_REDIRECT_URI = "https://headboard-api.fly.dev/"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # appsettings.json pins Urls to localhost:5080 for local runs; the container must listen on all interfaces.
  Urls = "http://0.0.0.0:8080"
  ConnectionStrings__Sqlite = "Data Source=/data/headboard.db"
  Storage__Root = "/data/storage"
  Cors__Origins__0 = "https://headboard-api.fly.dev"
  Cors__Origins__1 = "https://head-board.vercel.app"
  Calendar__RedirectUri = "https://headboard-api.fly.dev/calendar/oauth/callback"
  Calendar__AllowedReturnUrls__0 = "https://headboard-api.fly.dev"
  Calendar__AllowedReturnUrls__1 = "https://head-board.vercel.app"
  Calendar__AllowedReturnUrls__2 = "http://localhost:5173"
  Calendar__AllowedReturnUrls__3 = "headboard://"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
